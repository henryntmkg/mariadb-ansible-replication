version: '3.8'

services:
  mariadb:
    image: mariadb:10.11
    container_name: mariadb_node
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: rootpassword
      MARIADB_DATABASE: pdns
      MARIADB_USER: pdns
      MARIADB_PASSWORD: pdnspassword
    ports:
      - "3306:3306"
    volumes:
      - ./my.cnf:/etc/mysql/conf.d/replication.cnf
      - mariadb_data:/var/lib/mysql

volumes:
  mariadb_data:
